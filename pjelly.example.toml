database_url = "sqlite:///personality_jelly.db"
default_language = "zh-CN"
log_level = "INFO"

[llm]
provider = "openai-compatible"
base_url = "https://api.openai.com/v1"
model = "gpt-4.1-mini"
timeout_seconds = 60
json_response_format = "json_schema"

[embedding]
provider = "openai-compatible"
base_url = "https://api.openai.com/v1"
model = "text-embedding-3-small"
timeout_seconds = 60
